apiVersion: apps/v1
kind: Deployment
metadata:
  name: human-verification
  namespace: ilay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: human-verification
  template:
    metadata:
      labels:
        app: human-verification
    spec:
      containers:
        - name: human-verification
          image: ghcr.io/ilyavorwork/human-verification:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: common-config
          env:
            - name: POSTGRES_DB
              value: "human_verification"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: secret-key
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /rk/v1/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /rk/v1/alive
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
