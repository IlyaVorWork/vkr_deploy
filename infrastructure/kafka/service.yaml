# ClusterIP — для клиентских подключений (продюсеры/консьюмеры используют kafka:9092)
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ilay
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
---
# Headless — для pod-specific DNS (KRaft quorum voters и ADVERTISED_LISTENERS)
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: ilay
spec:
  selector:
    app: kafka
  clusterIP: None
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
